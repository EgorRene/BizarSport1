<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BizarSport">
<meta name="format-detection" content="telephone=no">
<title>BizarSport</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');

:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c232c;--bg4:#232b36;
  --panel:#161b22;--panel2:#1c232c;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --border:#30363d;--border2:#21262d;--border3:#2d333b;
  --accent:#e63946;--accent2:#ff4d5a;--accent-dim:rgba(230,57,70,.15);
  --success:#3fb950;--warning:#d29922;--danger:#f85149;--info:#58a6ff;
  --income:#3fb950;--expense:#f85149;
  --radius:8px;--radius-sm:6px;--radius-lg:12px;
  --sidebar-w:220px;--topbar-h:56px;
  color-scheme:dark;
}
[data-theme="light"]{--bg:#f6f8fa;--bg2:#fff;--bg3:#f0f3f6;--bg4:#e6ebf0;--panel:#fff;--text:#1f2328;--text2:#656d76;--text3:#8c959f;--border:#d0d7de;--border2:#e6ebf0;--accent:#cf222e;color-scheme:light}
[data-theme="blue"]{--bg:#0a1628;--bg2:#0f1f38;--bg3:#152a48;--text:#e6f0ff;--accent:#3b82f6;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;display:flex}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
input,select,textarea,button{-webkit-appearance:none;appearance:none;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;width:100%;outline:none;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}
input[type="checkbox"]{width:auto;appearance:auto;-webkit-appearance:checkbox}
input[type="radio"]{width:auto;appearance:auto;-webkit-appearance:radio}
input[type="number"]{-moz-appearance:textfield;appearance:textfield}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:var(--text)!important;-webkit-box-shadow:0 0 0 1000px var(--bg3) inset!important;transition:background-color 5000s}
select option{background:var(--bg2);color:var(--text)}

.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;grid-template-areas:"sidebar topbar" "sidebar main";width:100%;min-height:100vh}
.sidebar{grid-area:sidebar;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;position:sticky;top:0;height:100vh}
.sidebar-brand{padding:16px 18px 12px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sidebar-brand-logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:16px;color:#fff;flex-shrink:0}
.sidebar-brand-text{font-family:'Manrope',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.3px}
.sidebar-brand-text .accent{color:var(--accent)}
.sidebar-nav{display:flex;flex-direction:column;padding:8px 8px 20px;gap:1px}
.nav-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:500;color:var(--text2);cursor:pointer;user-select:none;position:relative}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
.nav-item .ico{width:16px;text-align:center;font-size:14px}
.nav-item .count{margin-left:auto;font-size:10px;font-weight:700;background:var(--accent);color:#fff;border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}

.topbar{grid-area:topbar;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:16px;position:sticky;top:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:16px;min-width:0}
.topbar-title{font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--bg3);border:1px solid var(--border2);font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap}
.pill.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.live{background:var(--success);color:#fff;border-color:var(--success)}

.main{grid-area:main;padding:20px 24px 60px;max-width:1400px;width:100%;overflow-x:hidden}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.card:hover{border-color:var(--border3)}
.card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:6px}
.card-value{font-family:'Manrope',sans-serif;font-weight:700;font-size:20px}
.card-sub{font-size:11px;color:var(--text2);margin-top:2px}

.grid{display:grid;gap:10px}
.grid-stats{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.grid-cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grid-finance{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;font-size:12px;font-weight:600;padding:8px 14px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;border:1px solid var(--accent);cursor:pointer;white-space:nowrap;width:auto}
.btn:hover{background:var(--accent2)}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border)}
.btn-ghost:hover{background:var(--bg3)}
.btn-soft{background:var(--accent-dim);color:var(--accent);border-color:transparent}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-sm{font-size:11px;padding:5px 10px}
.btn-lg{font-size:14px;padding:12px 20px}

.section{margin-bottom:24px}
.section-title{font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.section-title .more{font-size:11px;font-weight:500;color:var(--text2);cursor:pointer}
.section-title .more:hover{color:var(--accent)}

.table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.table th{background:var(--bg3);color:var(--text2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
.table td{padding:8px 10px;border-bottom:1px solid var(--border2);vertical-align:middle;overflow:hidden;text-overflow:ellipsis}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:var(--bg3)}
.table tr.clickable{cursor:pointer}
.table .num{text-align:center;font-variant-numeric:tabular-nums}

.pos{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.3px;text-transform:uppercase}
.pos-GK{background:rgba(210,153,34,.15);color:#d29922}
.pos-CB,.pos-LB,.pos-RB{background:rgba(88,166,255,.15);color:#58a6ff}
.pos-CDM,.pos-CM,.pos-CAM,.pos-LM,.pos-RM{background:rgba(63,185,80,.15);color:#3fb950}
.pos-LW,.pos-RW,.pos-ST,.pos-CF{background:rgba(230,57,70,.15);color:#f85149}

.rating{display:inline-block;font-family:'Manrope',sans-serif;font-weight:700;font-size:11.5px;padding:2px 7px;border-radius:4px;background:var(--bg4);min-width:26px;text-align:center}
.rating.high{background:var(--success);color:#fff}
.rating.mid{background:var(--warning);color:#111}
.rating.low{background:var(--danger);color:#fff}

.empty{padding:40px 20px;text-align:center;color:var(--text2);border:1px dashed var(--border);border-radius:var(--radius)}
.empty strong{display:block;font-family:'Manrope',sans-serif;font-size:15px;color:var(--text);margin-bottom:4px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(3px)}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;max-width:900px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border2)}
.modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.modal-actions .btn{flex:1;min-width:100px}

.attrs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin:10px 0}
.attr{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:11px}
.attr-name{flex:1;color:var(--text2)}
.attr-bar{flex:1.2;height:4px;background:var(--border);border-radius:2px;overflow:hidden;min-width:30px}
.attr-bar-fill{height:100%;background:var(--accent)}
.attr-val{font-family:'Manrope',sans-serif;font-weight:700;font-size:11px;padding:2px 7px;border-radius:3px;background:var(--bg4);min-width:24px;text-align:center}
.attr-val.high{background:var(--success);color:#fff}
.attr-val.mid{background:var(--warning);color:#111}
.attr-val.low{background:var(--danger);color:#fff}

.news-item{padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;border-left:3px solid var(--accent)}
.news-item.type-transfer{border-left-color:var(--info)}
.news-item.type-match{border-left-color:var(--success)}
.news-item.type-injury{border-left-color:var(--warning)}
.news-item.type-award{border-left-color:#d29922}
.news-item.type-unexpected{border-left-color:#a371f7}
.news-item.type-economy{border-left-color:#22c55e}
.news-item.type-national{border-left-color:#e11d48}
.news-meta{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.news-title{font-weight:700;font-size:13px;margin:3px 0}
.news-body{font-size:12px;color:var(--text2)}

.club-head{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.club-head h2{font-family:'Manrope',sans-serif;font-weight:800;font-size:22px}
.club-head .meta{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.6}
.club-head .meta strong{color:var(--text)}

.crest-sm{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:9px;color:#fff;border:1.5px solid var(--border);overflow:hidden}
.crest-md{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;color:#fff;border:2px solid var(--border);overflow:hidden}
.team-cell{display:flex;align-items:center;gap:10px;min-width:0}
.team-cell strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.form{display:inline-flex;gap:2px;vertical-align:middle}
.form-dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.form-W{background:var(--success)}
.form-D{background:var(--warning)}
.form-L{background:var(--danger)}

.window-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius);background:var(--accent-dim);border:1px solid var(--accent);margin-bottom:16px}
.window-bar .label{font-weight:700;color:var(--accent);text-transform:uppercase;font-size:11px;letter-spacing:.5px}
.window-bar .bar{flex:1;height:6px;background:rgba(0,0,0,.2);border-radius:3px;overflow:hidden}
.window-bar .bar-fill{height:100%;background:var(--accent)}

.progress{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);transition:width .2s}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg4);color:var(--text2);text-transform:uppercase;letter-spacing:.3px}
.badge.ok{background:rgba(63,185,80,.15);color:var(--success)}
.badge.warn{background:rgba(210,153,34,.15);color:var(--warning)}
.badge.bad{background:rgba(248,81,73,.15);color:var(--danger)}
.badge.accent{background:var(--accent-dim);color:var(--accent)}
.badge.info{background:rgba(88,166,255,.15);color:var(--info)}

.award{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;position:relative;overflow:hidden}
.award::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.award-name{font-weight:700;color:var(--accent);text-transform:uppercase;font-size:11px;letter-spacing:.5px}
.award-winner{font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;margin:4px 0}
.award-detail{font-size:11px;color:var(--text2)}

.match-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border2);font-size:12.5px}
.match-row:last-child{border-bottom:none}
.match-row:hover{background:var(--bg3)}
.match-score{font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;padding:4px 12px;background:var(--bg4);border-radius:5px;min-width:56px;text-align:center;cursor:pointer}
.match-score:hover{background:var(--accent);color:#fff}
.match-block{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;background:var(--panel)}
.match-block-head{padding:10px 14px;background:var(--bg3);font-weight:700;font-size:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border2)}

.match-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px;background:var(--bg3);border-radius:var(--radius);margin-bottom:16px}
.match-header .team{font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;text-align:center}
.match-header .score{font-family:'Manrope',sans-serif;font-weight:800;font-size:26px;padding:0 14px;letter-spacing:2px}

.timeline{border:1px solid var(--border2);background:var(--bg3);border-radius:var(--radius-sm);padding:4px 0;max-height:300px;overflow-y:auto}
.tl-event{display:grid;grid-template-columns:44px 24px 1fr;gap:10px;align-items:center;padding:7px 12px;font-size:11.5px;border-bottom:1px dashed var(--border2)}
.tl-event.tl-goal{background:rgba(63,185,80,.08)}
.tl-event.tl-yellow{background:rgba(210,153,34,.08)}
.tl-min{font-family:'Manrope',sans-serif;font-weight:700;color:var(--accent)}

.stat-line{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;margin:6px 0;font-size:11px}
.stat-line .val{font-family:'Manrope',sans-serif;font-weight:700;text-align:center}
.stat-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;display:flex}
.stat-bar .home{background:var(--accent);height:100%}
.stat-bar .away{background:var(--text3);height:100%}

.bc{font-size:12px;color:var(--text2);margin-bottom:14px}
.bc span{color:var(--accent);cursor:pointer}
.bc span:hover{text-decoration:underline}

.start-hint{border:1px solid var(--accent);background:var(--panel);border-radius:var(--radius-lg);padding:32px 24px;text-align:center;margin:20px 0;box-shadow:0 0 40px rgba(230,57,70,.1)}
.start-hint h2{font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;margin-bottom:8px}
.start-hint p{color:var(--text2);font-size:13px;margin-bottom:20px}

.medal{display:inline-flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:12px;width:28px;height:22px;border-radius:4px}
.medal-1{background:#f5c518;color:#111}
.medal-2{background:#c0c0c0;color:#111}
.medal-3{background:#b45309;color:#fff}
.medal-x{background:var(--bg4);color:var(--text2)}

.fin-inc{color:var(--income)}
.fin-exp{color:var(--expense)}

.save-ind{position:fixed;top:14px;right:14px;background:var(--bg4);font-size:11px;font-weight:600;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .25s;z-index:2000;border:1px solid var(--border)}
.save-ind.show{opacity:1}

.toast-container{position:fixed;bottom:20px;right:20px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:320px;pointer-events:none}
.toast{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateX(120%);transition:transform .25s;pointer-events:auto;font-size:12px}
.toast.show{transform:translateX(0)}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.info{border-left-color:var(--info)}
.toast-title{font-weight:700;margin-bottom:2px}
.toast-body{color:var(--text2);font-size:11.5px}

.search{display:flex;gap:8px;margin-bottom:14px}
.search input{flex:1}

.goal-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:999px;font-size:11px;font-weight:600}
.goal-chip.ok{border-color:var(--success);color:var(--success)}
.goal-chip.warn{border-color:var(--warning);color:var(--warning)}

.club-picker-list{max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;background:var(--bg3)}
.club-picker-group{padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);background:var(--bg4);border-bottom:1px solid var(--border2);position:sticky;top:0;z-index:2}
.club-picker-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border2);transition:background .12s}
.club-picker-item:hover{background:var(--bg4)}
.club-picker-item.selected{background:var(--accent-dim);border-left:3px solid var(--accent)}
.club-picker-item .name{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.club-picker-item .sub{font-size:10px;color:var(--text3)}
.club-picker-item .budget{font-family:'Manrope',sans-serif;font-weight:700;font-size:12px;flex-shrink:0}
.club-picker-item .check{color:var(--accent);font-size:16px;flex-shrink:0}

.star-btn{background:transparent;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:2px;width:auto;transition:color .12s}
.star-btn:hover{color:#f5c518}
.star-btn.active{color:#f5c518}

.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-bar select,.filter-bar input{max-width:160px}

.achievement{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;font-size:11px;margin:3px}
.achievement.unlocked{border-color:var(--warning);background:rgba(210,153,34,.1);color:var(--warning)}

.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}

.deal-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer}
.deal-card:hover{border-color:var(--accent)}
.deal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.deal-player{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.deal-flow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);margin-bottom:8px;flex-wrap:wrap}

  .sidebar.open{transform:translateX(0)}

  .main{padding:14px 12px 80px;margin-top:0}

  .match-row{font-size:11.5px;padding:8px}
  .modal{padding:14px}

let _uidCounter=0;
function uid(){
  // Гибрид: инкремент + рандом = гарантия уникальности в сессии
  _uidCounter++;
  return 'p' + _uidCounter.toString(36) + Math.random().toString(36).slice(2,7);
}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtM(n){n=Math.round(n);const a=Math.abs(n),s=n<0?'-':'';if(a>=1e9)return s+(a/1e9).toFixed(2)+'B €';if(a>=1e6)return s+(a/1e6).toFixed(2)+'M €';if(a>=1e3)return s+(a/1e3).toFixed(1)+'K €';return s+a+' €'}
function baseVal(r){return r<=40?50000:Math.round(Math.pow(r-40,2)*8000+r*50000)}
function calcVal(r,age,vm){let b=baseVal(r);const am=age<=21?1.3:age<=27?1.2:age<=30?1.0:age<=33?0.7:0.4;return Math.round(b*am*(vm||1))}
function clubColor(c){if(CLUB_COLORS[c.name])return CLUB_COLORS[c.name];const colors=['#c8102e','#1d4ed8','#15803d','#ca8a04','#7c3aed','#0891b2','#e11d48','#ea580c','#0f766e','#4338ca'];let h=0;for(let i=0;i<c.name.length;i++)h=(h*31+c.name.charCodeAt(i))|0;return colors[Math.abs(h)%colors.length]}
function crestSm(c){return crestHtml(c,'crest-sm')}
function crestMd(c){return crestHtml(c,'crest-md')}
function crestHtml(c,cls){const t=c.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(),bg=clubColor(c);
  if(c.crest)return '<img class="'+cls+' crest-img" src="'+esc(c.crest)+'" data-t="'+t+'" data-bg="'+bg+'" alt="">';
  return '<span class="'+cls+'" style="background:'+bg+';">'+t+'</span>'}
function fileToCrest(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=96;const x=cv.getContext('2d'),k=Math.min(96/im.width,96/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(96-w)/2,(96-h)/2,w,h);cb(cv.toDataURL('image/png'))};im.onerror=()=>toast('Ошибка','Не удалось прочитать картинку','error');im.src=r.result};r.readAsDataURL(file)}
let newCrests={},crestLeague=null;
function crestEditor(label,get,set){
  const d=document.createElement('div');d.style.cssText='display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap';
  const pv=document.createElement('span'),draw=()=>{const v=get();pv.innerHTML=v?'<img class="crest-md crest-img" src="'+esc(v)+'" alt="">':'<span class="crest-md" style="background:var(--bg4)">?</span>'};
  const nm=document.createElement('span');nm.style.cssText='flex:1 1 120px;font-weight:600;min-width:100px';nm.textContent=label;
  const u=document.createElement('input');u.type='text';u.placeholder='URL эмблемы (https://…)';u.style.cssText='flex:2 1 180px;width:auto;min-width:140px';const cv=get();if(cv&&cv.indexOf('data:')!==0)u.value=cv;
  u.addEventListener('change',()=>{set(u.value.trim()||null);draw()});
  const f=document.createElement('input');f.type='file';f.accept='image/*';f.style.display='none';
  f.addEventListener('change',()=>{if(f.files[0])fileToCrest(f.files[0],v=>{set(v);u.value='';draw()})});
  const g=document.createElement('button');g.type='button';g.className='btn btn-ghost btn-sm';g.textContent='🖼 Галерея';g.addEventListener('click',()=>f.click());
  const x=document.createElement('button');x.type='button';x.className='btn btn-ghost btn-sm';x.textContent='✕';x.addEventListener('click',()=>{set(null);u.value='';draw()});
  draw();d.append(pv,nm,u,g,f,x);return d;
}
function ratingClass(r){if(r>=80)return 'high';if(r>=65)return 'mid';return 'low'}
function formBadge(form){if(!form||!form.length)return '';return '<span class="form">'+form.map(f=>'<span class="form-dot form-'+f+'"></span>').join('')+'</span>'}

function toast(title,body,type){
  const c=document.getElementById('toastContainer');
  if(!c)return;
  const el=document.createElement('div');
  el.className='toast '+(type||'');
  el.innerHTML='<div class="toast-title">'+esc(title)+'</div>'+(body?'<div class="toast-body">'+esc(body)+'</div>':'');
  c.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},3200);
}

let idb=null;
function initIDB(){
  return new Promise(resolve=>{
    if(!window.indexedDB){resolve(null);return}
    let done=false;
    const finish=(val)=>{if(done)return;done=true;resolve(val)};
    const timer=setTimeout(()=>finish(null),1500);
    try{
      const req=indexedDB.open('bizarsport',3);
      req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('state'))db.createObjectStore('state')};
      req.onsuccess=e=>{clearTimeout(timer);idb=e.target.result;finish(idb)};
      req.onerror=()=>{clearTimeout(timer);finish(null)};
      req.onblocked=()=>{clearTimeout(timer);finish(null)};
    }catch(e){clearTimeout(timer);finish(null)}
  });
}
function idbSave(json){
  if(!idb)return Promise.resolve(false);
  return new Promise(resolve=>{
    try{
      const tx=idb.transaction('state','readwrite');
      tx.objectStore('state').put(json,'game');
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>resolve(false);
    }catch(e){resolve(false)}
  });
}
function idbLoad(){
  if(!idb)return Promise.resolve(null);
  return new Promise(resolve=>{
    try{
      const tx=idb.transaction('state','readonly');
      const req=tx.objectStore('state').get('game');
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null)}
  });
}

        if(ok){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}}

function applyParsed(parsed){
  if(!parsed)return false;
  try{
    game=Object.assign(game,parsed);
    ['countries','leagues','clubs','players','coaches','presidents','matches','transfers','deals','loans','news','awards','seasonHistory','retired','achievements','shortlist','nationalTeams','nationalMatches','ffpViolations'].forEach(k=>{if(!Array.isArray(game[k]))game[k]=[]});
    if(!game.settings)game.settings={theme:'dark',customNames:{}};
    if(!game.settings.customNames)game.settings.customNames={};
    if(!game.eurocups)game.eurocups={};
    if(!game.cups)game.cups={};
    game.leagues.forEach(l=>{if(!Array.isArray(l.buyFrom))l.buyFrom=[]});
    game.clubs.forEach(c=>{if(c.owner===undefined){const pr=game.presidents.find(x=>x.clubId===c.id);c.owner=pr?{name:pr.name,age:pr.age,style:pr.style,vision:''}:null}});
    game.coaches=[];game.deals=[];game.loans=[];game.players.forEach(p=>{if(p.loan){p.clubId=p.loan.fromClubId;p.loan=null}});if(game.settings.regenShare==null)game.settings.regenShare=30;
    Object.keys(game.settings.customNames).forEach(cn=>{
      const c=game.settings.customNames[cn];
      if(c&&c.f&&c.l)NAMES[cn]={f:c.f,l:c.l};
    });
    return true;
  }catch(e){return false}
}
function load(){

    }).catch(()=>{});

}

const playerById=id=>{if(!idx.playerById.size)rebuildIdMaps();return idx.playerById.get(id)};
const clubById=id=>{if(!idx.clubById.size)rebuildIdMaps();return idx.clubById.get(id)};

function assignTransferProfile(club,league){
  const rating=club.rating;
  let style;
  if(rating>=85)style='contender';
  else if(rating>=75)style='buyer';
  else if(rating>=65)style='balanced';
  else if(rating>=55)style='developer';
  else style='seller';
  const rules=league.rules||LEAGUE_RULES[league.name]||{maxBuyPrice:50e6,maxWage:8e6,maxForeign:15,minHomegrown:8};
  const maxBuyPrice=Math.min(rules.maxBuyPrice,Math.round(club.budget*0.6));
  const maxWage=rules.maxWage;
  let preferredAge=[18,27],preferredRating=[70,90];
  if(style==='contender'){preferredAge=[22,29];preferredRating=[82,95]}
  else if(style==='buyer'){preferredAge=[20,28];preferredRating=[75,87]}
  else if(style==='balanced'){preferredAge=[20,30];preferredRating=[68,82]}
  else if(style==='developer'){preferredAge=[16,22];preferredRating=[60,78]}
  else if(style==='seller'){preferredAge=[18,26];preferredRating=[55,75]}
  club.transferProfile={style,maxBuyPrice,maxWage,preferredAge,preferredRating,maxSquad:25,minHomegrown:rules.minHomegrown,maxForeign:rules.maxForeign};
}

  o=o||{};

  const pos=o.pos||pick(POS_AUTO);

    attributes:genAttrs(pos,r),clubId:club.id,countryId:natC.id,nationality:natC.name,
    goals:0,assists:0,matches:0,joinedYear:game.year,boughtPrice:null,boughtFrom:null,
    wage:Math.round(v*0.0015),morale:rnd(60,90),freeAgent:false,injuryWeeks:0,suspensionWeeks:0,fatigue:0,
    seasonStats:[],careerStats:{matches:0,goals:0,assists:0},
    leagueStats:{},

/* Ручной список: «Имя Фамилия; ПОЗ; возраст; рейтинг; гражданство» (всё кроме имени — необязательно) */
function parsePlayers(text){
  const out=[];
  String(text||'').split('\n').forEach(line=>{
    line=line.trim();if(!line)return;
    const sep=/[;|\t]/.test(line)?/[;|\t]/:/,/;
    const t=line.split(sep).map(x=>x.trim());
    if(!t[0])return;
    const o={name:t[0]};
    const pos=(t[1]||'').toUpperCase();if(ALL_POSITIONS.includes(pos))o.pos=pos;
    const age=parseInt(t[2]);if(!isNaN(age))o.age=clamp(age,15,45);
    const rt=parseInt(t[3]);if(!isNaN(rt))o.rating=clamp(rt,30,99);
    if(t[4])o.nationality=t[4];
    out.push(o);
  });
  return out;
}
/* Заполнение состава: auto — 18 игроков, manual — только вручную, mixed — вручную + добор до 18 */
function fillSquad(club,league,country,mode,manual){
  manual=manual||[];
  if(mode!=='auto')manual.forEach(o=>makePlayer(club,league,country,o));
  if(mode==='manual')return;
  let need=POS_AUTO.slice();
  if(mode==='mixed')manual.forEach(o=>{const i=need.indexOf(o.pos);if(i>=0)need.splice(i,1)});
  if(mode==='mixed')need=need.slice(0,Math.max(0,18-manual.length));
  need.forEach(pos=>makePlayer(club,league,country,{pos}));
}

function refreshNationalSquads(){
  for(const nt of game.nationalTeams){
    const country=countryById(nt.countryId);
    if(!country)continue;
    const players=game.players.filter(p=>p.nationality===country.name&&!p.retired&&!p.freeAgent).sort((a,b)=>b.rating-a.rating).slice(0,23);
    nt.squad=players.map(p=>p.id);
    nt.rating=players.length?Math.round(players.reduce((s,p)=>s+p.rating,0)/players.length):60;

function runNationalWindow(){
  if(!isNationalWindow(game.week))return;
  refreshNationalSquads();
  // Товарищеские матчи
  const teams=game.nationalTeams.slice().sort((a,b)=>b.rating-a.rating);
  const top=teams.slice(0,30);
  for(let i=0;i<top.length-1;i+=2){
    const a=top[i],b=top[i+1];
    const sa=a.rating,sb=b.rating;
    const ga=Math.max(0,Math.round(sa-sb+1+rnd(-2,2)));
    const gb=Math.max(0,Math.round(sb-sa+1+rnd(-2,2)));
    const winner=ga>gb?a:gb>ga?b:null;
    // Обновить форму
    a.form.push(ga>gb?'W':ga<gb?'L':'D');if(a.form.length>5)a.form.shift();
    b.form.push(gb>ga?'W':gb<ga?'L':'D');if(b.form.length>5)b.form.shift();
    // Обновить caps у игроков
    for(const pid of a.squad){const p=playerById(pid);if(p)p.nationalCaps=(p.nationalCaps||0)+1}
    for(const pid of b.squad){const p=playerById(pid);if(p)p.nationalCaps=(p.nationalCaps||0)+1}
    game.nationalMatches.unshift({year:game.year,week:game.week,a:a.name,b:b.name,ga,gb,type:'friendly'});
  }
  if(game.nationalMatches.length>500)game.nationalMatches=game.nationalMatches.slice(0,500);
}

function calcStrength(cid){
  if(idx.sc.has(cid))return idx.sc.get(cid);
  const ps=playersOf(cid).filter(p=>p.injuryWeeks<=0&&p.suspensionWeeks<=0&&!p.retired);
  let r=40;
  if(ps.length){
    const myC=cid===game.myClubId&&clubById(cid),arr=(myC&&myC.lineup)?startingXI(myC):ps.slice();
    arr.sort((a,b)=>b.rating-a.rating);
    const n=Math.min(11,arr.length);
    let s=0;for(let i=0;i<n;i++){const q=arr[i];s+=q.rating-Math.max(0,((q.fatigue||0)-60)/10)+((q.morale===undefined?70:q.morale)-70)/25}
    r=s/n;
  }
  idx.sc.set(cid,r);
  return r;
}
function calcTacticalStrength(club,isHome){
  let base=calcStrength(club.id);
  const formation=club.formation||{};
  const attBonus=getFormationAttack(formation.inPossession);
  const defBonus=getFormationDefense(formation.outOfPossession);
  if(isHome)base+=attBonus*0.6+defBonus*0.4;
  else base+=attBonus*0.3+defBonus*0.7;
  if(club.tactic==='атака')base+=1.5;
  else if(club.tactic==='оборона')base-=0.5;
  else if(club.tactic==='прессинг')base+=0.5;
  return base;
}
function getFormationAttack(f){return {'4-3-3':2,'4-2-3-1':1.5,'4-4-2':0.5,'3-4-3':2.5,'3-5-2':1,'5-3-2':-1}[f]||0}
function getFormationDefense(f){return {'4-4-2':1,'4-2-3-1':1.5,'4-3-3':0.5,'3-5-2':1.5,'5-3-2':3,'5-4-1':3.5}[f]||0}

function assignSeasonGoal(club){
  const l=leagueById(club.leagueId);
  if(!l)return;
  const sorted=game.clubs.filter(c=>c.leagueId===l.id).sort((a,b)=>b.rating-a.rating);
  const pos=sorted.findIndex(c=>c.id===club.id)+1;
  const total=sorted.length;
  if(pos<=2)club.goal='Чемпионство';
  else if(pos<=6)club.goal='Топ-6';
  else if(pos<=total-4)club.goal='Середина таблицы';
  else club.goal='Выживание';
}

function getSeasonEntry(player,clubId,clubName){

  if(!s){s={year:game.year,clubId,clubName,matches:0,goals:0,assists:0};player.seasonStats.push(s)}
  return s;
}
function getLeagueEntry(player,leagueName){
  if(!player.leagueStats)player.leagueStats={};
  if(!player.leagueStats[leagueName])player.leagueStats[leagueName]={matches:0,goals:0,assists:0};
  return player.leagueStats[leagueName];
}
function updateCareer(player,dM,dG,dA){
  if(!player.careerStats)player.careerStats={matches:0,goals:0,assists:0};
  player.careerStats.matches=(player.careerStats.matches||0)+(dM||0);
  player.careerStats.goals=(player.careerStats.goals||0)+(dG||0);
  player.careerStats.assists=(player.careerStats.assists||0)+(dA||0);
}
function updateClubHistory(player,clubId,clubName,dM,dG,dA){
  if(!player.clubHistory)player.clubHistory=[];
  let h=player.clubHistory[player.clubHistory.length-1];
  if(!h||h.clubId!==clubId){
    if(h&&h.toYear===null)h.toYear=game.year;
    h={clubId,clubName,fromYear:game.year,toYear:null,matches:0,goals:0,assists:0};
    player.clubHistory.push(h);
  }
  h.matches=(h.matches||0)+(dM||0);
  h.goals=(h.goals||0)+(dG||0);
  h.assists=(h.assists||0)+(dA||0);
}
function addSeasonMatch(player,club,isStarter){
  const l=club?leagueById(club.leagueId):null;
  const s=getSeasonEntry(player,club.id,club.name);
  const ls=l?getLeagueEntry(player,l.name):null;
  if(isStarter){
    s.matches++;if(ls)ls.matches++;
    updateCareer(player,1,0,0);
    updateClubHistory(player,club.id,club.name,1,0,0);
  }
  player.fatigue=Math.min(100,(player.fatigue||0)+rnd(5,15));
  player.recentMinutes=(player.recentMinutes||0)+90;
  if((player.fatigue>=80&&Math.random()<0.15)||Math.random()<0.004){
    player.injuryWeeks=rnd(1,5);
    player.fatigue=0;
    pushNews('🚑 Травма',player.name+' выбыл на '+player.injuryWeeks+' нед.','injury');
  }
}
function addSeasonAssist(player,club){const l=club?leagueById(club.leagueId):null,st=getSeasonEntry(player,club.id,club.name),ls=l?getLeagueEntry(player,l.name):null;st.assists++;if(ls)ls.assists++;updateCareer(player,0,0,1);updateClubHistory(player,club.id,club.name,0,0,1)}
function creditAssist(xi,sc,club,events){
  if(Math.random()>0.75)return;
  const W={CAM:5,CM:3,LW:5,RW:5,LM:4,RM:4,CDM:2,LB:2.5,RB:2.5,ST:2,CF:2,CB:0.7,GK:0.05};let tot=0;
  const c=xi.filter(p=>p.id!==sc.id).map(p=>{const w=(W[p.position]||1)*Math.pow(p.rating/70,2);tot+=w;return[p,w]});
  if(!c.length)return;
  let r=Math.random()*tot,a=c[0][0];for(const x of c){r-=x[1];if(r<=0){a=x[0];break}}
  a.assists=(a.assists||0)+1;addSeasonAssist(a,club);
  const e=events[events.length-1];if(e){e.text+=' · ассист '+a.name;e.assistId=a.id;e.assistName=a.name}
}
function addSeasonGoal(player,club){
  const l=club?leagueById(club.leagueId):null;
  const s=getSeasonEntry(player,club.id,club.name);
  const ls=l?getLeagueEntry(player,l.name):null;
  s.goals++;if(ls)ls.goals++;
  updateCareer(player,0,1,0);
  updateClubHistory(player,club.id,club.name,0,1,0);
}
function pushForm(player,result){
  if(!player.form)player.form=[];

}
function addMatchRating(player,rating){
  if(!player.matchRatings)player.matchRatings=[];
  player.matchRatings.push(rating);
  if(player.matchRatings.length>10)player.matchRatings.shift();
  player.lastMatchRating=rating;
}

function pickScorer(players){
  if(!players.length)return null;
  const n=players.length;
  const weights=new Float32Array(n);
  let total=0;
  for(let i=0;i<n;i++){
    const p=players[i];
    let w=1;
    const pos=p.position;
    if(pos==='GK')w=0.02;
    else if(pos==='CB'||pos==='LB'||pos==='RB')w=0.4;
    else if(pos==='CDM')w=0.3;
    else if(pos==='CM'||pos==='LM'||pos==='RM')w=1.2;
    else if(pos==='CAM')w=2.2;
    else if(pos==='LW'||pos==='RW')w=2.5;
    else if(pos==='ST')w=3.5;
    else if(pos==='CF')w=3.0;
    w*=p.rating*0.05;
    const fin=p.attributes?.finishing||10;
    w*=(0.5+fin/20);
    if(p.form&&p.form.length){
      const wins=p.form.filter(x=>x==='W').length;
      w*=(0.8+wins*0.1);
    }
    if((p.morale||70)<40)w*=0.7;
    weights[i]=w;
    total+=w;
  }
  let r=Math.random()*total;
  for(let i=0;i<n;i++){r-=weights[i];if(r<=0)return players[i]}
  return players[n-1];
}

function simulateMatch(h,a,comp,isCup){
  const hs=calcTacticalStrength(h,true)+8+rnd(-2,2);
  const as=calcTacticalStrength(a,false);
  const diff=hs-as;
  const hg=Math.max(0,Math.round(1.4+diff*0.06+(Math.random()-0.5)*2.5));
  const ag=Math.max(0,Math.round(1.1-diff*0.06+(Math.random()-0.5)*2.5));
  const events=[];
  const hP=startingXI(h);
  const aP=startingXI(a);
  const used=new Set();
  const nextMin=()=>{let m=rnd(1,90),g=0;while(used.has(m)&&g++<50)m=rnd(1,90);used.add(m);return m};
  for(let i=0;i<hg;i++){
    const s=pickScorer(hP);
    if(s){events.push({minute:nextMin(),type:'goal',team:'home',playerId:s.id,playerName:s.name,text:'⚽ '+s.name+' ('+h.name+')'});s.goals=(s.goals||0)+1;addSeasonGoal(s,h);creditAssist(hP,s,h,events)}
  }
  for(let i=0;i<ag;i++){
    const s=pickScorer(aP);
    if(s){events.push({minute:nextMin(),type:'goal',team:'away',playerId:s.id,playerName:s.name,text:'⚽ '+s.name+' ('+a.name+')'});s.goals=(s.goals||0)+1;addSeasonGoal(s,a);creditAssist(aP,s,a,events)}
  }
  {const gc={};events.forEach(e=>{if(e.type==='goal')gc[e.playerId]=(gc[e.playerId]||0)+1});
   for(const id in gc)if(gc[id]>=3){const e=events.find(x=>x.playerId===id);pushNews('🎩 Хет-трик',e.playerName+' забил '+gc[id]+' в матче '+h.name+' — '+a.name,'system')}}
  const yc=rnd(1,4);
  for(let i=0;i<yc;i++){
    const isH=Math.random()<0.5;
    const pl=pick(isH?hP:aP);
    if(pl){pl.yc=(pl.yc||0)+1;if(pl.yc%4===0){pl.suspensionWeeks=1;pushNews('🟨 Дисквалификация',pl.name+' пропустит матч за 4 жёлтые','injury')}}
    if(pl)events.push({minute:nextMin(),type:'yellow',team:isH?'home':'away',playerId:pl.id,playerName:pl.name,text:'🟨 '+pl.name});
  }
  if(Math.random()<0.07){
    const isH=Math.random()<0.5,pl=pick(isH?hP:aP);
    if(pl){pl.suspensionWeeks=rnd(1,3);events.push({minute:nextMin(),type:'red',team:isH?'home':'away',playerId:pl.id,playerName:pl.name,text:'🟥 '+pl.name});pushNews('🟥 Удаление',pl.name+' удалён, пропустит '+pl.suspensionWeeks+' матч.','injury')}
  }
  events.sort((a,b)=>a.minute-b.minute);
  hP.forEach(p=>{addSeasonMatch(p,h,true);pushForm(p,hg>ag?'W':hg<ag?'L':'D');addMatchRating(p,Math.max(4,Math.min(10,6+((hg-ag)*0.3)+((p.rating-70)*0.03)+Math.random()*0.8)))});
  aP.forEach(p=>{addSeasonMatch(p,a,true);pushForm(p,ag>hg?'W':ag<hg?'L':'D');addMatchRating(p,Math.max(4,Math.min(10,6+((ag-hg)*0.3)+((p.rating-70)*0.03)+Math.random()*0.8)))});
  const hGoals=events.filter(e=>e.type==='goal'&&e.team==='home');
  const aGoals=events.filter(e=>e.type==='goal'&&e.team==='away');
  const countGoals=(evs)=>{const m={};evs.forEach(e=>{m[e.playerId]=(m[e.playerId]||0)+1});return m};
  Object.values(countGoals(hGoals)).forEach(c=>{if(c>=3)unlockAchievement('hat_trick')});
  Object.values(countGoals(aGoals)).forEach(c=>{if(c>=3)unlockAchievement('hat_trick')});

  const hP0=Math.max(35,Math.min(65,Math.round(50+diff*0.4+rnd(-5,5))));
  const m={id:uid(),year:game.year,week:game.week,competition:comp,homeClubId:h.id,awayClubId:a.id,homeGoals:hg,awayGoals:ag,events,stats:{possession:[hP0,100-hP0],shots:[Math.max(hg,hg+rnd(4,10)),Math.max(ag,ag+rnd(3,9))],shotsOnTarget:[Math.max(hg,rnd(hg,hg+4)),Math.max(ag,rnd(ag,ag+3))],corners:[rnd(2,9),rnd(1,7)],fouls:[rnd(5,15),rnd(5,15)]}};
  matchRing.push(m);
  idx.matchById.set(m.id,m);
  const stadiumFill=Math.min(h.stadium.capacity,Math.round(h.stadium.capacity*(0.6+h.reputation/300+rnd(-5,5)/100)));
  const matchIncome=Math.round(stadiumFill*h.ticketPrice*0.6);
  h.budget+=matchIncome;
  if(!h.finances)h.finances={transferIncome:[],transferExpense:[],sponsorIncome:0,tvIncome:0,wagesPaid:0,matchdayIncome:0,prizeIncome:0,sponsors:[]};
  h.finances.matchdayIncome=(h.finances.matchdayIncome||0)+matchIncome;
  if(Math.abs(hg-ag)>=5){
    const winner=hg>ag?h:a,loser=hg>ag?a:h;
    pushNews('🔥 Разгром',winner.name+' разгромил '+loser.name+' '+Math.max(hg,ag)+':'+Math.min(hg,ag),'match');
  }
  return m;
}

function updateStandings(l,m){
  const h=l.standings.find(s=>s.clubId===m.homeClubId);
  const a=l.standings.find(s=>s.clubId===m.awayClubId);
  if(h){h.played++;h.gf+=m.homeGoals;h.ga+=m.awayGoals;if(m.homeGoals>m.awayGoals){h.wins++;h.points+=3}else if(m.homeGoals<m.awayGoals){h.losses++}else{h.draws++;h.points++}}
  if(a){a.played++;a.gf+=m.awayGoals;a.ga+=m.homeGoals;if(m.awayGoals>m.homeGoals){a.wins++;a.points+=3}else if(m.awayGoals<m.homeGoals){a.losses++}else{a.draws++;a.points++}}
}

function roundRobin(clubs,week){
  const t=clubs.slice().sort((a,b)=>a.id<b.id?-1:1);if(t.length%2)t.push(null);
  const n=t.length,R=n-1,r=Math.max(0,week-1-(week>23?2:0))%(R*2),leg=r>=R?1:0,k=r%R;
  const rest=t.slice(1),arr=[t[0]].concat(rest.map((_,i)=>rest[(i-k+R)%R])),out=[];
  for(let i=0;i<n/2;i++){let a=arr[i],b=arr[n-1-i];if(!a||!b)continue;
    if((i+k)%2){const x=a;a=b;b=x}
    if(leg){const x=a;a=b;b=x}
    out.push([a,b])}
  return out;
}
function simulateWeek(){
  const all=[];
  for(const l of game.leagues){
    const clubs=clubsOf(l.id);
    if(clubs.length<2)continue;
    for(const pr of roundRobin(clubs,game.week)){const m=simulateMatch(pr[0],pr[1],l.name,false);updateStandings(l,m);all.push(m)}
  }
  game.lastWeekMatches=all.slice(0,500);
  const my=game.myClubId&&all.find(m=>m.homeClubId===game.myClubId||m.awayClubId===game.myClubId);
  if(my){const h=clubById(my.homeClubId),a=clubById(my.awayClubId),w=(my.homeClubId===game.myClubId?my.homeGoals-my.awayGoals:my.awayGoals-my.homeGoals);
    if(!window.__fast)toast(w>0?'Победа!':w<0?'Поражение':'Ничья',h.name+' '+my.homeGoals+':'+my.awayGoals+' '+a.name,w>0?'success':w<0?'error':'info')}
}

function developPlayers(){
  for(const p of game.players){
    if(p.freeAgent||!p.clubId||p.retired)continue;
    if(p.age<=21&&p.rating<p.potential){if(Math.random()<0.04+(21-p.age)*0.01)p.rating++}
    else if(p.age<=24&&p.rating<p.potential){if(Math.random()<0.03)p.rating++}
    if(p.age>=30){const chance=0.02*(p.age-29);if(Math.random()<chance)p.rating=Math.max(40,p.rating-1)}
    const l=leagueById(clubById(p.clubId)?.leagueId);
    p.value=calcVal(p.rating,p.age,l?.valueMult||1);
  }
}
function processRetirements(){
  // Тихий ретайр — без новостей
  for(const p of game.players){
    if(p.freeAgent||!p.clubId||p.retired)continue;
    if(p.age>=RETIRE_AGE&&Math.random()<RETIRE_CHANCE){
      const c=clubById(p.clubId);
      // Закрыть clubHistory
      if(p.clubHistory&&p.clubHistory.length){
        const last=p.clubHistory[p.clubHistory.length-1];
        if(last.toYear===null)last.toYear=game.year;
      }
      game.retired.push({name:p.name,age:p.age,rating:Math.round(p.rating),year:game.year,clubName:c?c.name:'—',goals:p.careerStats?.goals||0,assists:p.careerStats?.assists||0});
      p.freeAgent=true;p.clubId=null;p.retired=true;p.retiredYear=game.year;
      if(p.age>=40)unlockAchievement('long_career');
    }
  }
  if(game.retired.length>500)game.retired=game.retired.slice(-500);
}

function recoverPlayers(){
  for(const p of game.players){
    if(p.fatigue>0)p.fatigue=Math.max(0,p.fatigue-10);
    if(p.injuryWeeks>0)p.injuryWeeks=Math.max(0,p.injuryWeeks-1);
    if(p.suspensionWeeks>0)p.suspensionWeeks=Math.max(0,p.suspensionWeeks-1);
    if(p.morale===undefined)p.morale=70;
  }
}
function applyTraining(){
  const c=game.myClubId&&clubById(game.myClubId);if(!c)return;
  const m=c.training||'normal';
  playersOf(c.id).forEach(p=>{
    if(m==='hard'){p.fatigue=Math.min(100,(p.fatigue||0)+6);p.morale=Math.max(30,(p.morale||70)-1);if(p.age<=23&&p.rating<p.potential&&Math.random()<0.012)p.rating++}
    else if(m==='rest'){p.fatigue=Math.max(0,(p.fatigue||0)-12);p.morale=Math.min(100,(p.morale||70)+1)}
  });
}
function payWages(){
  for(const c of game.clubs){
    const squad=playersOf(c.id);
    let totalWages=0;
    for(const p of squad)totalWages+=(p.wage||0)/52*ECON.wageMul;
    c.budget-=totalWages;
    if(c.budget<-5e7){if(!c.transferBan){c.transferBan=true;pushNews('⛔ Санкции',c.name+': запрет на покупки из-за долгов','economy')}}else if(c.budget>0)c.transferBan=false;
    if(c.finances)c.finances.wagesPaid=(c.finances.wagesPaid||0)+totalWages;
  }
}
function payTVAndSponsors(){
  if(game.week%4!==0)return;
  for(const c of game.clubs){
    const l=leagueById(c.leagueId);
    if(!l)continue;
    const tv=Math.round(((l.level-50)*30000+500000)*ECON.tvMul);
    // спонсоры
    let sponsorSum=0;
    for(const s of (c.finances?.sponsors||[])){
      if(game.year>=s.fromYear&&game.year<=s.toYear)sponsorSum+=Math.round(s.amount*4/SEASON_WEEKS*ECON.sponsorMul);
    }
    const mult=c.budgetFreeze?0.5:1;
    c.budget+=(tv+sponsorSum)*mult;
    if(c.finances){c.finances.tvIncome=(c.finances.tvIncome||0)+tv;c.finances.sponsorIncome=(c.finances.sponsorIncome||0)+sponsorSum}
  }
}
function checkFFP(){
  if(game.week!==SEASON_WEEKS)return;
  for(const c of game.clubs){
    const income=c.finances.transferIncome.reduce((s,x)=>s+x.amount,0)+(c.finances.tvIncome||0)+(c.finances.sponsorIncome||0)+(c.finances.matchdayIncome||0)+(c.finances.prizeIncome||0);
    const expense=c.finances.transferExpense.reduce((s,x)=>s+x.amount,0)+(c.finances.wagesPaid||0);
    if(expense>income*1.5){
      game.ffpViolations.push({clubId:c.id,clubName:c.name,year:game.year,deficit:expense-income});
      pushNews('📋 Нарушение FFP',c.name+' потратил больше, чем заработал','economy');
    }
  }
  if(game.ffpViolations.length>200)game.ffpViolations=game.ffpViolations.slice(-200);
}

function contractFactor(p){const left=p.contractEnd==null?3:p.contractEnd-game.year+1;return left<=1?0.5:left===2?0.8:1}
const CLUB_RATINGS={};
function budgetRating(b,lv){const x=Math.max(0,Math.min(1,Math.log(Math.max(b,5e6)/5e6)/Math.log(250e6/5e6)));return Math.round(Math.max(40,Math.min(99,lv-14+x*14)))}
function fixClubRatings(){
  for(const c of game.clubs){
    if(c.ratingFixed)continue;
    const l=leagueById(c.leagueId),t=CLUB_RATINGS[c.name]!==undefined?CLUB_RATINGS[c.name]:budgetRating(c.budget,l?l.level:70),d=t-c.rating;
    c.rating=c.reputation=t;c.ratingFixed=true;
    if(d)playersOf(c.id).forEach(p=>{p.rating=Math.max(40,Math.min(97,p.rating+Math.round(d*0.92)))});
  }
}
function startingXI(club){
  const ok=playersOf(club.id).filter(p=>p.injuryWeeks<=0&&p.suspensionWeeks<=0&&!p.retired),by=(a,b)=>b.rating-a.rating;
  let xi=[];
  if(club.id===game.myClubId&&club.lineup&&club.lineup.length)xi=club.lineup.map(id=>ok.find(p=>p.id===id)).filter(Boolean);
  if(xi.length<11){const u=new Set(xi.map(p=>p.id));xi=xi.concat(ok.filter(p=>!u.has(p.id)).sort(by).slice(0,11-xi.length))}
  xi=xi.slice(0,11);
  if(!xi.some(p=>p.position==='GK')){const g=ok.filter(p=>p.position==='GK').sort(by)[0];if(g)xi[xi.length-1]=g}
  return xi;
}
function doTransfer(player,seller,buyer,price,wage){
  if(buyer.budget<price)return;
  buyer.budget-=price;if(seller)seller.budget+=price;
  if(player.lastTransferYear!==game.year)player.transfersThisSeason=0;
  player.transfersThisSeason=(player.transfersThisSeason||0)+1;
  player.lastTransferWeek=game.week;player.lastTransferYear=game.year;
  if(player.clubHistory&&player.clubHistory.length){
    const last=player.clubHistory[player.clubHistory.length-1];
    if(last.toYear===null)last.toYear=game.year;
  }
  player.clubId=buyer.id;player.joinedYear=game.year;player.contractEnd=game.year+rnd(2,5);player.loan=null;player.freeAgent=false;
  player.boughtPrice=price;player.boughtFrom=seller?seller.name:'Свободный агент';
  if(!player.clubHistory)player.clubHistory=[];
  player.clubHistory.push({clubId:buyer.id,clubName:buyer.name,fromYear:game.year,toYear:null,matches:0,goals:0,assists:0});
  if(wage)player.wage=wage;
  if(seller&&seller.finances)seller.finances.transferIncome.push({year:game.year,week:game.week,playerId:player.id,playerName:player.name,playerPosition:player.position,playerAge:player.age,amount:price,toClubName:buyer.name,toClubId:buyer.id,direction:'out'});
  if(buyer.finances)buyer.finances.transferExpense.push({year:game.year,week:game.week,playerId:player.id,playerName:player.name,playerPosition:player.position,playerAge:player.age,amount:price,fromClubName:seller?seller.name:'Свободный агент',fromClubId:seller?seller.id:null,direction:'in'});
  game.transfers.unshift({year:game.year,week:game.week,playerId:player.id,playerName:player.name,playerRating:Math.round(player.rating),playerPosition:player.position,playerAge:player.age,fromClubId:seller?seller.id:null,fromClubName:seller?seller.name:'Свободный агент',toClubId:buyer.id,toClubName:buyer.name,price});
  if(game.transfers.length>500)game.transfers=game.transfers.slice(0,500);
  idx.transferIdxDirty=true;
  invalidateIdx();
}

function generateYouthPlayers(){
  const regenPool=game.countries.filter(x=>x.regenOnly),regenShare=((game.settings&&game.settings.regenShare!=null)?game.settings.regenShare:30)/100;
  for(const c of game.clubs){
    const academyLevel=c.infrastructure?.academy||50;
    const num=academyLevel>80?rnd(2,4):academyLevel>60?rnd(1,3):rnd(0,2);
    for(let i=0;i<num;i++){
      let country=countryById(c.countryId);if(regenPool.length&&Math.random()<regenShare)country=pick(regenPool);if(!country)continue;
      const pos=pick(['GK','CB','LB','RB','CDM','CM','CAM','LM','RM','LW','RW','ST']);
      const baseRating=Math.round(40+academyLevel*0.35+rnd(-5,8));
      const r=Math.max(40,Math.min(75,baseRating));
      const age=rnd(16,19);
      const potentialBonus=academyLevel>80?rnd(15,30):rnd(5,20);
      const potential=Math.min(99,r+potentialBonus);
      const v=calcVal(r,age,leagueById(c.leagueId)?.valueMult||1)*0.5;

function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}

const ent=(c,id)=>c.nat?game.nationalTeams.find(t=>(t.id||t.name)===id):clubById(id);
function playComp(c){
  const cur=c.cur,next=[],pairs=[],my=game.myClubId,n=cur.length;
  for(let i=0;i+1<n;i+=2){
    const a=ent(c,cur[i]),b=ent(c,cur[i+1]);if(!a||!b){next.push(cur[i]);continue}
    const sa=c.nat?a.rating:calcStrength(a.id),sb=c.nat?b.rating:calcStrength(b.id);
    const ga=Math.max(0,Math.round(1.3+(sa-sb)*0.06+(Math.random()-0.5)*2.6)),gb=Math.max(0,Math.round(1.1-(sa-sb)*0.06+(Math.random()-0.5)*2.6));
    const w=ga>gb?a:gb>ga?b:(Math.random()<0.5?a:b);
    pairs.push({home:a.name,away:b.name,score:ga+':'+gb+(ga===gb?' (пен.)':''),winner:w.name});next.push(w.id||w.name);

  if(next.length===1){

    if(!c.nat){w.titles=w.titles||{};

    pushNews('🏆 '+c.name,w.name+(c.nat?' — чемпион!':' выиграл турнир'),'award');

function runKO(teams,name){
  if(teams.length<4)return null;
  const rounds=[];let cur=teams.slice();
  while(cur.length>=2){
    const next=[],pairs=[];
    for(let i=0;i<cur.length-1;i+=2){
      const a=cur[i],b=cur[i+1];
      const sa=calcStrength(a.id),sb=calcStrength(b.id);
      const ga=Math.max(0,Math.round(sa-sb+rnd(-2,2)+1));
      const gb=Math.max(0,Math.round(sb-sa+rnd(-2,2)+1));
      const winner=ga>gb?a:gb>ga?b:(Math.random()<0.5?a:b);
      pairs.push({home:a.name,away:b.name,score:ga+':'+gb,winner:winner.name});
      next.push(winner);
    }
    rounds.push({stage:cur.length===2?'Финал':cur.length===4?'1/2 финала':cur.length===8?'1/4 финала':cur.length===16?'1/8 финала':'Раунд',pairs});

function getSeasonStat(p){
  if(!p.seasonStats)return null;
  const entries=p.seasonStats.filter(s=>s.year===game.year);
  if(!entries.length)return null;
  return entries.reduce((acc,s)=>({matches:acc.matches+s.matches,goals:acc.goals+s.goals,assists:acc.assists+s.assists}),{matches:0,goals:0,assists:0});
}
function holdAwards(){
  const all=game.players.filter(p=>!p.freeAgent&&p.clubId&&!p.retired);
  const withStats=all.map(p=>({p,s:getSeasonStat(p)})).filter(x=>x.s&&x.s.matches>0);
  if(!withStats.length)return;
  withStats.forEach(x=>{x._score=x.s.goals*3+x.s.assists*2+x.p.rating});
  const top=[...withStats].sort((a,b)=>b._score-a._score)[0];
  if(top&&!game.awards.some(a=>a.year===game.year&&a.title==='🏆 Золотой мяч')){
    const c=clubById(top.p.clubId);
    game.awards.unshift({year:game.year,title:'🏆 Золотой мяч',playerName:top.p.name,detail:(c?c.name:'')+' · '+top.s.goals+' голов'});
  }
  const ts=[...withStats].sort((a,b)=>b.s.goals-a.s.goals)[0];
  if(ts&&ts.s.goals>0&&!game.awards.some(a=>a.year===game.year&&a.title==='⚽ Лучший бомбардир')){
    game.awards.unshift({year:game.year,title:'⚽ Лучший бомбардир',playerName:ts.p.name,detail:ts.s.goals+' голов'});
  }
  const ta=[...withStats].sort((a,b)=>b.s.assists-a.s.assists)[0];
  if(ta&&ta.s.assists>0&&!game.awards.some(a=>a.year===game.year&&a.title==='👟 Лучший ассистент')){
    game.awards.unshift({year:game.year,title:'👟 Лучший ассистент',playerName:ta.p.name,detail:ta.s.assists+' ассистов'});
  }
  const gks=withStats.filter(x=>x.p.position==='GK');
  if(gks.length&&!game.awards.some(a=>a.year===game.year&&a.title==='🧤 Лучший вратарь')){
    const g=[...gks].sort((a,b)=>b.p.rating-a.p.rating)[0];
    game.awards.unshift({year:game.year,title:'🧤 Лучший вратарь',playerName:g.p.name,detail:'Рейтинг '+Math.round(g.p.rating)});
  }
  const yng=withStats.filter(x=>x.p.age<=21);
  if(yng.length&&!game.awards.some(a=>a.year===game.year&&a.title==='🌟 Лучший молодой игрок')){
    const y=[...yng].sort((a,b)=>b._score-a._score)[0];
    game.awards.unshift({year:game.year,title:'🌟 Лучший молодой игрок',playerName:y.p.name,detail:y.p.age+' лет'});
  }
  if(game.awards.length>500)game.awards.length=500;
}
function finishSeason(){

        snapshot.champions.push({league:l.name,club:c.name});

function advanceWeek(){
  try{
    game.week++;
    if(game.week>SEASON_WEEKS){
      game.week=1;game.year++;
      holdAwards();
      runEurocups();
      runCup();
      finishSeason();
    }
    if(!isBreakWeek(game.week))simulateWeek();
    runNationalWindow();playCompWeek();
    recoverPlayers();
    developPlayers();
    processRetirements();
    applyTraining();
    payWages();
    payTVAndSponsors();
    if(game.week===SEASON_WEEKS)checkFFP();
    rollUnexpectedEvents();
    invalidateIdx();
    save();
  }catch(e){console.error('advanceWeek error:',e);toast('Ошибка',e.message,'error')}
  renderCurrent();
}
async function advanceSeason(){
  
  const weeksLeft=SEASON_WEEKS-game.week+1;
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg2);border:1px solid var(--accent);padding:22px 28px;border-radius:12px;z-index:3000;text-align:center;min-width:280px';
  overlay.innerHTML='<div style="font-weight:700;color:var(--accent);text-transform:uppercase;font-size:12px;margin-bottom:10px">Симуляция</div><div id="asProgress" style="font-size:12px;margin-bottom:8px">0 / '+weeksLeft+'</div><div class="progress"><div class="progress-fill" id="asFill" style="width:0%"></div></div>';
  document.body.appendChild(overlay);
  window.__fast=true;
  try{
    for(let i=0;i<weeksLeft;i++){
      game.week++;
      if(game.week>SEASON_WEEKS){game.week=1;game.year++;holdAwards();runEurocups();runCup();finishSeason()}
      if(!isBreakWeek(game.week))simulateWeek();
      runNationalWindow();playCompWeek();recoverPlayers();developPlayers();processRetirements();applyTraining();payWages();payTVAndSponsors();
      if(game.week===SEASON_WEEKS)checkFFP();
      rollUnexpectedEvents();
      if(i%3===0){
        const pr=document.getElementById('asProgress'),fl=document.getElementById('asFill');
        if(pr)pr.textContent=(i+1)+' / '+weeksLeft;
        if(fl)fl.style.width=((i+1)/weeksLeft*100)+'%';

      }
    }
  }catch(e){console.error(e);toast('Ошибка',e.message,'error')}

function layoutFormation(formation,isHome,w,h){
  // Простая раскладка по строкам формации
  const lines=formation.split('-').map(Number);
  const positions=[];
  // Вратарь
  positions.push({x:isHome?30:w-30,y:h/2});
  let x=isHome?80:w-80;
  const stepX=(w-160)/Math.max(lines.length-1,1);
  lines.forEach((count,i)=>{
    const rowX=isHome?80+i*stepX:w-80-i*stepX;
    for(let j=0;j<count;j++){
      const rowY=h/2-(count-1)*30/2+j*30;
      positions.push({x:rowX,y:rowY});
    }
  });
  return positions.slice(0,11);
}

    const d=document.createElement('div');d.className='v3-end';d.innerHTML='<h2>Матч окончен</h2><div class="v3-sc">'+esc(hC.name)+' <b>'+m.homeGoals+' : '+m.awayGoals+'</b> '+esc(aC.name)+'</div><div>Владение: '+poss[0]+'% — '+poss[1]+'%</div><div>Удары: '+sh[0]+' — '+sh[1]+'</div><div>Лучший игрок: <b>'+(best?esc(best):'—')+'</b></div><br><button class="btn" id="v3z">Закрыть</button>';
    ov.appendChild(d);d.querySelector('#v3z').onclick=close;
  }
  let raf,last=performance.now();
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    if(!paused&&!ended)update(dt*speed);
    const bx=ball.p.x,dir=ball.team==='home'?1:-1;let tp,tl;
    if(camMode===0){tp=new T.Vector3(bx*0.7,34,56);tl=new T.Vector3(bx*0.8,0,0)}
    else if(camMode===1){tp=new T.Vector3(bx*0.4,100,1);tl=new T.Vector3(bx*0.4,0,0)}
    else if(camMode===2){tp=new T.Vector3(bx*0.9,6,38);tl=ball.p.clone()}
    else{tp=new T.Vector3(bx-dir*16,10,ball.p.z*0.6+14);tl=ball.p.clone()}
    camP.lerp(tp,0.05);camL.lerp(tl,0.08);cam.position.copy(camP);cam.lookAt(camL);
    R.render(sc,cam);raf=requestAnimationFrame(frame);
  }
  const onR=()=>{W=innerWidth;H=innerHeight;R.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix()};addEventListener('resize',onR);
  function close(){cancelAnimationFrame(raf);removeEventListener('resize',onR);R.dispose();ov.remove()}
  q('v3x').onclick=close;q('v3p').onclick=()=>{paused=!paused;q('v3p').textContent=paused?'▶':'⏸'};
  q('v3sp').onclick=()=>{speed=speed===1?2:speed===2?4:1;q('v3sp').textContent=speed+'×'};
  q('v3cam').onclick=()=>{camMode=(camMode+1)%4};
  raf=requestAnimationFrame(frame);
}

  h+=row2(fld('Название',inp('ceName',null,c.name)),fld('Рейтинг клуба',inp('ceRating',null,c.rating,'number')));
  h+=row2(fld('Бюджет, млн €',inp('ceBudget',null,Math.round(c.budget/1e5)/10,'number')),fld('Вместимость стадиона',inp('ceCap',null,st.capacity||'','number')));
  h+=fld('Стадион (название)',inp('ceStad',null,st.name||''));
  h+=secT('Главный тренер');
  h+=row2(fld('Имя',inp('ceCoName',null,co.name||'')),fld('Возраст',inp('ceCoAge',null,co.age||'','number')));
  h+=fld('Стиль',selHtml('ceCoStyle',Object.keys(COACH_STYLES),co.style||'прагматичный'));
  h+=fld('Видение тренера',tarea('ceCoVision',3,'Как тренер хочет играть, что строит в клубе…',co.vision));
  h+=secT('Владелец клуба');
  h+=row2(fld('Имя',inp('ceOwName',null,ow.name||'')),fld('Возраст',inp('ceOwAge',null,ow.age||'','number')));
  h+=fld('Стиль',selHtml('ceOwStyle',OWNER_STYLES,ow.style||'сбалансированный'));
  h+=fld('Видение владельца',tarea('ceOwVision',3,'Цели и планы владельца…',ow.vision));
  h+=secT('Добавить игроков вручную');
  h+=fld('По одному в строке: Имя; ПОЗ; возраст; рейтинг; гражданство',tarea('cePlayers',4,'Иван Иванов; ST; 24; 78\nПётр Петров; GK'));
  h+='<div style="display:flex;gap:8px;margin-top:6px"><button class="btn" id="ceSave">💾 Сохранить</button><button class="btn btn-ghost" id="ceClose">Закрыть</button></div>';
  openModalHtml(h);
  document.getElementById('ceClose').addEventListener('click',closeModal);
  document.getElementById('ceSave').addEventListener('click',()=>{
    const name=$v('ceName');if(!name){toast('Ошибка','Название клуба не может быть пустым','error');return}
    c.name=name;
    const rt=clamp(Math.round($n('ceRating',c.rating)),30,99);c.rating=rt;c.reputation=rt;c.ratingFixed=true;
    c.budget=Math.max(0,Math.round($n('ceBudget',c.budget/1e6)*1e6));
    if(!c.stadium)c.stadium={capacity:30000,condition:80,expansion:null};
    c.stadium.name=$v('ceStad')||c.stadium.name||(name+' Арена');
    const cap=Math.round($n('ceCap',0));if(cap>0)c.stadium.capacity=cap;
    c.coach={name:$v('ceCoName')||(c.coach&&c.coach.name)||'—',age:Math.round($n('ceCoAge',(c.coach&&c.coach.age)||50)),style:$v('ceCoStyle'),vision:$v('ceCoVision')};
    c.tactic=COACH_STYLES[c.coach.style]||c.tactic;
    c.owner={name:$v('ceOwName')||(c.owner&&c.owner.name)||'—',age:Math.round($n('ceOwAge',(c.owner&&c.owner.age)||55)),style:$v('ceOwStyle'),vision:$v('ceOwVision')};
    const list=parsePlayers($v('cePlayers'));
    if(list.length){const l=leagueById(c.leagueId),ct=countryById(c.countryId);if(l&&ct)list.forEach(o=>makePlayer(c,l,ct,o))}
    afterWorldChange(leagueById(c.leagueId));
    closeModal();renderCurrent();toast('Сохранено',c.name+(list.length?' · +'+list.length+' игр.':''),'success');
  });
}
/* ---------- редактор лиги ---------- */
function openLeagueEditor(id){
  const l=leagueById(id);if(!l)return;
  const r=l.rules||{maxBuyPrice:50e6,maxWage:8e6,maxForeign:15,minHomegrown:8},hd=l.head||{};
  let h='<div class="section-title">✏️ '+esc(l.name)+'</div>';
  h+=fld('Название лиги',inp('leName',null,l.name));
  h+=row2(fld('Уровень (30–99)',inp('leLevel',null,l.level,'number')),fld('Множитель стоимости',inp('leVm',null,l.valueMult,'number')));
  h+=row2(fld('Макс. цена покупки, млн €',inp('leBuy',null,Math.round(r.maxBuyPrice/1e5)/10,'number')),fld('Макс. зарплата, млн €',inp('leWage',null,Math.round(r.maxWage/1e5)/10,'number')));
  h+=row2(fld('Макс. легионеров',inp('leFor',null,r.maxForeign,'number')),fld('Мин. воспитанников',inp('leHome',null,r.minHomegrown,'number')));
  h+=secT('Глава лиги');
  h+=row2(fld('Имя',inp('leHeadName',null,hd.name||'')),fld('Должность',inp('leHeadTitle',null,hd.title||'Президент лиги')));
  h+=fld('Видение главы лиги',tarea('leHeadVision',4,'Куда лига должна прийти, правила, приоритеты…',hd.vision));
  h+='<div style="display:flex;gap:8px;margin-top:6px"><button class="btn" id="leSave">💾 Сохранить</button><button class="btn btn-ghost" id="leClose">Закрыть</button></div>';
  openModalHtml(h);
  document.getElementById('leClose').addEventListener('click',closeModal);
  document.getElementById('leSave').addEventListener('click',()=>{
    const name=$v('leName');if(!name){toast('Ошибка','Название лиги не может быть пустым','error');return}
    l.name=name;l.level=clamp(Math.round($n('leLevel',l.level)),30,99);l.valueMult=clamp($n('leVm',l.valueMult),0.1,3);
    l.rules={maxBuyPrice:$n('leBuy',50)*1e6,maxWage:$n('leWage',8)*1e6,maxForeign:Math.round($n('leFor',15)),minHomegrown:Math.round($n('leHome',8))};
    l.head={name:$v('leHeadName')||(l.head&&l.head.name)||'—',title:$v('leHeadTitle')||'Президент лиги',vision:$v('leHeadVision')};
    clubsOf(l.id).forEach(c=>assignTransferProfile(c,l));
    save();closeModal();renderCurrent();toast('Сохранено',l.name,'success');
  });
}

/* ---------- РЕДАКТОР ---------- */
function renderEditor(el){
  const tabs=[['countries','Страны'],['leagues','Лиги'],['clubs','Клубы'],['crests','Эмблемы'],['add','+ Страна'],['addleague','+ Лига'],['addclub','+ Клуб']];
  let h='<div class="toolbar">'+tabs.map(([k,v])=>'<button class="btn '+(editorTab===k?'':'btn-ghost')+' btn-sm" data-tab="'+k+'">'+v+'</button>').join('')+'</div>';
  const lastCountry=game.countries.length?game.countries[game.countries.length-1].id:null;
  const countryOpts=game.countries.map(c=>[c.id,c.name]);
  const leagueOpts=game.leagues.map(l=>{const c=countryById(l.countryId);return [l.id,l.name+(c?' · '+c.name:'')]});
  const pickLeague=()=>(editorSel.league&&leagueById(editorSel.league))?editorSel.league:(game.leagues.length?game.leagues[game.leagues.length-1].id:null);

  if(editorTab==='add'){
    h+='<div class="card" style="max-width:620px"><div class="card-sub" style="margin-bottom:12px"><strong>Шаг 1.</strong> Страна и имена игроков. Дальше — «+ Лига», потом «+ Клуб». Пока в стране нет лиги, её реджены появляются во всех лигах мира (долю можно менять в Настройках).</div>'
      +fld('Страна',inp('nlCountry','Например: Россия'))
      +fld('Континент',selHtml('nlCont',Object.keys(CONT_NAMES).map(k=>[k,CONT_NAMES[k]]),'UEFA'))
      +fld('Имена игроков (через запятую)',tarea('nlFirst',2,'Иван, Пётр, Сергей, …'))
      +fld('Фамилии игроков (через запятую)',tarea('nlLast',2,'Иванов, Петров, Сидоров, …'))
      +'<button class="btn" id="nlSave">Создать страну → к лиге</button></div>';
  }else if(editorTab==='addleague'){
    if(!game.countries.length){h+='<div class="empty"><strong>Сначала создайте страну</strong>Вкладка «+ Страна»</div>'}
    else h+='<div class="card" style="max-width:620px"><div class="card-sub" style="margin-bottom:12px"><strong>Шаг 2.</strong> Лига страны, её правила и глава. Клубы можно сразу добавить списком (состав — автоматически) или потом по одному на вкладке «+ Клуб».</div>'
      +fld('Страна',selHtml('lgCountry',countryOpts,editorSel.country&&countryById(editorSel.country)?editorSel.country:lastCountry))
      +fld('Название лиги',inp('lgName','Например: Премьер-лига'))
      +row2(fld('Уровень лиги (30–99)',inp('lgLevel',null,70,'number')),fld('Множитель стоимости игроков',inp('lgVm',null,1,'number')))
      +secT('Правила трансферов')
      +row2(fld('Макс. цена покупки, млн €',inp('lgBuy',null,50,'number')),fld('Макс. зарплата, млн €',inp('lgWage',null,8,'number')))
      +row2(fld('Макс. легионеров',inp('lgFor',null,15,'number')),fld('Мин. воспитанников',inp('lgHome',null,8,'number')))
      +secT('Глава лиги')
      +row2(fld('Имя (пусто = случайное)',inp('lgHeadName')),fld('Должность',inp('lgHeadTitle',null,'Президент лиги')))
      +fld('Видение главы лиги',tarea('lgHeadVision',3,'Куда лига должна прийти, приоритеты…'))
      +secT('Клубы списком (необязательно)')
      +fld('По одному в строке: Название; бюджет в млн €; рейтинг (необязательно)',tarea('lgClubs',5,'Спартак; 60\nЗенит; 90; 82\nЛокомотив; 45'))
      +'<button class="btn" id="lgSave">Создать лигу</button></div>';
  }else if(editorTab==='addclub'){
    if(!game.leagues.length){h+='<div class="empty"><strong>Сначала создайте лигу</strong>Вкладка «+ Лига»</div>'}
    else h+='<div class="card" style="max-width:620px"><div class="card-sub" style="margin-bottom:12px"><strong>Шаг 3.</strong> Клуб: стадион, владелец, тренер и состав.</div>'
      +fld('Лига',selHtml('ncLeague',leagueOpts,pickLeague()))
      +fld('Название клуба',inp('ncName'))
      +row2(fld('Бюджет, млн €',inp('ncBudget',null,30,'number')),fld('Рейтинг (пусто = по бюджету)',inp('ncRating',null,'','number')))
      +row2(fld('Стадион',inp('ncStad','Пусто = «Название Арена»')),fld('Вместимость',inp('ncCap','Пусто = авто','','number')))
      +secT('Главный тренер')
      +row2(fld('Имя (пусто = случайное)',inp('ncCoName')),fld('Стиль',selHtml('ncCoStyle',Object.keys(COACH_STYLES),'прагматичный')))
      +fld('Видение тренера',tarea('ncCoVision',2,'Как тренер хочет играть…'))
      +secT('Владелец клуба')
      +row2(fld('Имя (пусто = случайное)',inp('ncOwName')),fld('Стиль',selHtml('ncOwStyle',OWNER_STYLES,'сбалансированный')))
      +fld('Видение владельца',tarea('ncOwVision',2,'Цели и планы владельца…'))
      +secT('Состав')
      +fld('Как набрать состав',selHtml('ncMode',[['auto','Автоматически (18 игроков)'],['manual','Вручную (только мой список)'],['mixed','Вручную + добрать автоматически']],'auto'))
      +fld('Игроки вручную — по одному в строке: Имя; ПОЗ; возраст; рейтинг; гражданство (всё, кроме имени, необязательно)',tarea('ncPlayers',5,'Иван Иванов; ST; 24; 78\nПётр Петров; GK; 30'))
      +'<button class="btn" id="ncSave">Создать клуб</button></div>';
  }else if(editorTab==='countries'){
    h+='<table class="table"><thead><tr><th>Страна</th><th>Континент</th><th>Лиг</th><th>Игроков</th><th></th></tr></thead><tbody>';
    game.countries.forEach(c=>{const l=game.leagues.filter(x=>x.countryId===c.id);const n=game.players.filter(p=>p.nationality===c.name&&!p.retired).length;h+='<tr><td>'+esc(c.name)+(c.regenOnly?' <span class="badge">только реджены</span>':'')+'</td><td>'+esc(c.continent)+'</td><td class="num">'+l.length+'</td><td class="num">'+n+'</td><td>'+(!l.length?'<button class="btn btn-ghost btn-sm" data-delcountry="'+c.id+'">✕</button>':'')+'</td></tr>'});
    h+='</tbody></table>';
    if(!game.countries.length)h+='<div class="empty"><strong>Стран пока нет</strong>Вкладка «+ Страна»</div>';
    h+='<div style="margin-top:16px"><button class="btn btn-danger btn-sm" id="clearWorldBtn">🧹 Очистить мир (все страны, лиги, клубы, игроки)</button></div>';
  }else if(editorTab==='leagues'){
    h+='<table class="table"><thead><tr><th>Лига</th><th>Страна</th><th>Кл.</th><th>Ур.</th><th>Глава лиги</th><th></th></tr></thead><tbody>';
    game.leagues.forEach(l=>{const c=countryById(l.countryId);const n=clubsOf(l.id).length;h+='<tr><td>'+esc(l.name)+'</td><td>'+(c?esc(c.name):'—')+'</td><td class="num">'+n+'</td><td class="num">'+l.level+'</td><td>'+esc(l.head&&l.head.name?l.head.name:'—')+'</td><td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" data-editleague="'+l.id+'">✏️</button>'+(n?'':' <button class="btn btn-ghost btn-sm" data-delleague="'+l.id+'">✕</button>')+'</td></tr>'});
    h+='</tbody></table>';
    if(!game.leagues.length)h+='<div class="empty"><strong>Лиг пока нет</strong>Вкладка «+ Лига»</div>';
  }else if(editorTab==='clubs'){
    if(!game.clubs.length)h+='<div class="empty"><strong>Клубов пока нет</strong>Вкладка «+ Клуб»</div>';
    else{
      h+='<table class="table"><thead><tr><th>Клуб</th><th>Лига</th><th>Тренер</th><th>Владелец</th><th>Стадион</th><th></th></tr></thead><tbody>';
      game.clubs.forEach(c=>{const l=leagueById(c.leagueId);h+='<tr><td>'+esc(c.name)+'</td><td>'+esc(l?l.name:'—')+'</td><td>'+esc(c.coach?c.coach.name:'—')+'</td><td>'+esc(c.owner?c.owner.name:'—')+'</td><td>'+esc(c.stadium&&c.stadium.name?c.stadium.name:'—')+'</td><td><button class="btn btn-ghost btn-sm" data-editclub="'+c.id+'">✏️</button></td></tr>'});
      h+='</tbody></table>';
    }
  }
  el.innerHTML=h;

  if(editorTab==='crests'){
    if(!game.leagues.length){el.insertAdjacentHTML('beforeend','<div class="empty">Сначала создайте лигу и клубы</div>')}
    else{
      if(!crestLeague||!leagueById(crestLeague))crestLeague=game.leagues[0].id;
      const sel=document.createElement('select');sel.style.cssText='max-width:260px;margin-bottom:10px';sel.innerHTML=game.leagues.map(l=>'<option value="'+l.id+'"'+(l.id===crestLeague?' selected':'')+'>'+esc(l.name)+'</option>').join('');
      sel.addEventListener('change',()=>{crestLeague=sel.value;renderEditor(el)});
      const note=document.createElement('div');note.className='card-sub';note.style.marginBottom='8px';note.textContent='Задайте URL или загрузите файл из галереи. Если URL не открывается, показываются инициалы.';
      el.append(sel,note);
      clubsOf(crestLeague).forEach(c=>el.appendChild(crestEditor(c.name,()=>c.crest||null,v=>{c.crest=v||undefined;save()})));
    }
  }
  el.querySelectorAll('[data-tab]').forEach(t=>t.addEventListener('click',()=>{editorTab=t.dataset.tab;renderEditor(el)}));
  el.querySelectorAll('[data-editclub]').forEach(b=>b.addEventListener('click',()=>openClubEditor(b.dataset.editclub)));
  el.querySelectorAll('[data-editleague]').forEach(b=>b.addEventListener('click',()=>openLeagueEditor(b.dataset.editleague)));

  /* Шаг 1: страна */
  document.getElementById('nlSave')?.addEventListener('click',()=>{
    const cName=$v('nlCountry'),cont=$v('nlCont');
    if(!cName){toast('Ошибка','Введи название страны','error');return}
    if(game.countries.some(c=>c.name.toLowerCase()===cName.toLowerCase())){toast('Ошибка','Такая страна уже есть','error');return}
    const f=$v('nlFirst').split(',').map(x=>x.trim()).filter(Boolean),l=$v('nlLast').split(',').map(x=>x.trim()).filter(Boolean);
    const country={id:uid(),name:cName,continent:cont,regenOnly:true};game.countries.push(country);
    if(f.length&&l.length){NAMES[cName]={f,l};game.settings.customNames[cName]={f,l}}
    game.nationalTeams.push({id:uid(),name:country.name,countryId:country.id,continent:country.continent,fifaRanking:rnd(1,200),rating:60,coachId:null,squad:[],friendlies:[],qualifiers:[],titles:{worldCup:0,continental:0},form:[]});
    invalidateIdx();save();
    editorSel.country=country.id;editorTab='addleague';renderCurrent();
    toast('Страна создана',cName+' — теперь добавь лигу'+((f.length&&l.length)?'':' (имена не заданы — будут общие)'),'success');
  });
  /* Шаг 2: лига */
  document.getElementById('lgSave')?.addEventListener('click',()=>{
    const country=countryById($v('lgCountry')),name=$v('lgName');
    if(!country||!name){toast('Ошибка','Укажи страну и название лиги','error');return}
    if(game.leagues.some(l=>l.countryId===country.id&&l.name.toLowerCase()===name.toLowerCase())){toast('Ошибка','Такая лига в этой стране уже есть','error');return}
    const lg=createLeague(country,{
      name,level:clamp(Math.round($n('lgLevel',70)),30,99),valueMult:clamp($n('lgVm',1),0.1,3),
      rules:{maxBuyPrice:$n('lgBuy',50)*1e6,maxWage:$n('lgWage',8)*1e6,maxForeign:Math.round($n('lgFor',15)),minHomegrown:Math.round($n('lgHome',8))},
      head:{name:$v('lgHeadName')||randName(country.name),title:$v('lgHeadTitle')||'Президент лиги',vision:$v('lgHeadVision')}
    });
    let made=0;
    $v('lgClubs')?.split('\n').forEach(line=>{
      line=line.trim();if(!line)return;
      const t=line.split(/[;|\t]/).map(x=>x.trim());if(!t[0])return;
      const bud=parseFloat((t[1]||'').replace(',','.'));const rt=parseInt(t[2]);
      createClub(t[0],(isNaN(bud)?20:bud)*1e6,lg,country,{rating:isNaN(rt)?null:rt});made++;
    });
    afterWorldChange(lg);
    editorSel.league=lg.id;editorTab=made?'clubs':'addclub';renderCurrent();
    toast('Лига создана',name+(made?' · клубов: '+made:' — добавь клубы'),'success');
  });
  /* Шаг 3: клуб */
  document.getElementById('ncSave')?.addEventListener('click',()=>{
    const lg=leagueById($v('ncLeague')),name=$v('ncName');
    if(!lg||!name){toast('Ошибка','Укажи лигу и название клуба','error');return}
    if(game.clubs.some(c=>c.leagueId===lg.id&&c.name.toLowerCase()===name.toLowerCase())){toast('Ошибка','Такой клуб в лиге уже есть','error');return}
    const country=countryById(lg.countryId);if(!country){toast('Ошибка','У лиги нет страны','error');return}
    const mode=$v('ncMode'),list=parsePlayers($v('ncPlayers'));
    if(mode!=='auto'&&!list.length){toast('Ошибка','Для ручного состава впиши хотя бы одного игрока','error');return}
    const rt=parseInt($v('ncRating')),cap=parseInt($v('ncCap'));
    createClub(name,Math.max(0,$n('ncBudget',30))*1e6,lg,country,{
      rating:isNaN(rt)?null:rt,stadiumName:$v('ncStad')||null,capacity:isNaN(cap)?null:cap,
      coach:{name:$v('ncCoName'),style:$v('ncCoStyle'),vision:$v('ncCoVision')},
      owner:{name:$v('ncOwName'),style:$v('ncOwStyle'),vision:$v('ncOwVision')},
      squadMode:mode,players:list
    });
    afterWorldChange(lg);
    editorSel.league=lg.id;renderCurrent();
    toast('Клуб создан',name+(mode==='manual'&&list.length<11?' · внимание: в составе меньше 11 игроков':''),mode==='manual'&&list.length<11?'info':'success');
  });
  /* Удаления */
  el.querySelectorAll('[data-delcountry]').forEach(b=>b.addEventListener('click',()=>{
    const c=countryById(b.dataset.delcountry);if(!c)return;
    if(game.players.some(p=>p.nationality===c.name&&!p.retired)){toast('Нельзя удалить','Есть активные игроки этой страны','error');return}
    game.countries=game.countries.filter(x=>x.id!==c.id);game.nationalTeams=game.nationalTeams.filter(t=>t.countryId!==c.id);
    delete game.settings.customNames[c.name];invalidateIdx();save();renderEditor(el);
  }));
  el.querySelectorAll('[data-delleague]').forEach(b=>b.addEventListener('click',()=>{
    const l=leagueById(b.dataset.delleague);if(!l)return;
    if(clubsOf(l.id).length){toast('Нельзя удалить','В лиге есть клубы','error');return}
    game.leagues=game.leagues.filter(x=>x.id!==l.id);
    if(!game.leagues.some(x=>x.countryId===l.countryId)){const c=countryById(l.countryId);if(c)c.regenOnly=true}
    invalidateIdx();save();renderEditor(el);
  }));
  document.getElementById('clearWorldBtn')?.addEventListener('click',e=>{
