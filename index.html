  function rerender(){listEl.innerHTML=renderClubPickerList(filtered,hiddenInput.value);listEl.querySelectorAll('[data-club-opt]').forEach(el=>{el.addEventListener('click',()=>{hiddenInput.value=el.dataset.clubOpt;const c=clubById(el.dataset.clubOpt);infoEl.innerHTML=c?'<strong>Выбран:</strong> '+esc(c.name)+' · Бюджет '+fmtM(c.budget):'Не выбран';rerender()})})}
  rerender();
  searchInput.addEventListener('input',()=>{const q=searchInput.value.toLowerCase().trim();filtered=q?clubs.filter(c=>c.name.toLowerCase().includes(q)):clubs;rerender()});
  document.getElementById('mtCn').addEventListener('click',closeModal);
  document.getElementById('mtOk').addEventListener('click',()=>{
    const newClubId=hiddenInput.value;if(!newClubId){toast('Ошибка','Выбери клуб','error');return}
    const price=Math.max(0,+document.getElementById('mtPrice').value||0);
    const buyer=clubById(newClubId);if(!buyer)return;
    const seller=p.clubId?clubById(p.clubId):null;
    if(buyer.budget<price){toast('Недостаточно','Нужно '+fmtM(price),'error');return}
    const wage=Math.max(0,+document.getElementById('mtWage').value||0)||p.wage;const endY=+document.getElementById('mtEnd').value||(game.year+3);
    doTransfer(p,seller,buyer,price,wage);p.contractEnd=endY;
    if(seller&&seller.lineup){seller.lineup=seller.lineup.filter(x=>x!==p.id);if(!seller.lineup.length)seller.lineup=null}
    if(price>=30e6)pushNews('💶 Трансфер',p.name+' → '+buyer.name+' за '+fmtM(price),'transfer');
    if(price>=100e6)unlockAchievement('transfer_100m');
    invalidateIdx();save();closeModal();renderCurrent();toast('Трансфер',p.name+' → '+buyer.name,'success');
  });
}
function renderClubPickerList(clubs,selectedId){
  if(!clubs.length)return '<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">Ничего</div>';
  const byLeague={};
  clubs.forEach(c=>{const l=leagueById(c.leagueId);const key=l?l.name:'—';if(!byLeague[key])byLeague[key]=[];byLeague[key].push(c)});
  let h='';
  Object.keys(byLeague).sort().forEach(leagueName=>{
    h+='<div class="club-picker-group">'+esc(leagueName)+'</div>';
    byLeague[leagueName].forEach(c=>{
      const isSel=c.id===selectedId;
      h+='<div class="club-picker-item '+(isSel?'selected':'')+'" data-club-opt="'+c.id+'">'+crestSm(c)+'<div style="flex:1;min-width:0"><div class="name">'+esc(c.name)+'</div><div class="sub">Рейтинг '+Math.round(c.rating)+'</div></div><div class="budget" style="color:'+(c.budget>20e6?'var(--success)':'var(--text2)')+'">'+fmtM(c.budget)+'</div>'+(isSel?'<div class="check">✓</div>':'')+'</div>';
    });
  });
  return h;
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function applyTheme(){document.body.setAttribute('data-theme',game.settings.theme||'dark')}
function restoreUidCounter(){
  let max=0;const scan=(id)=>{if(typeof id==='string'&&id.startsWith('p')){const n=parseInt(id.slice(1),36);if(!isNaN(n)&&n>max)max=n}};
  game.players.forEach(p=>scan(p.id));game.clubs.forEach(c=>scan(c.id));game.leagues.forEach(l=>scan(l.id));game.countries.forEach(c=>scan(c.id));matchRing.buf.forEach(m=>scan(m.id));game.transfers.forEach(t=>scan(t.id));game.coaches.forEach(c=>scan(c.id));(game.deals||[]).forEach(d=>scan(d.id));(game.nationalTeams||[]).forEach(t=>scan(t.id));
  _uidCounter=max;
}
document.getElementById('sidebarNav').addEventListener('click',e=>{
  const el=e.target.closest('.nav-item');
  if(el&&el.dataset.nav){currentNav=el.dataset.nav;footballPath={view:'countries',countryId:null,leagueId:null,clubId:null};closeSidebar();renderCurrent()}
});
const sidebarEl=document.getElementById('sidebar');
const backdropEl=document.getElementById('sidebarBackdrop');
document.getElementById('menuBtn').addEventListener('click',()=>{sidebarEl.classList.add('open');backdropEl.classList.add('open')});
backdropEl.addEventListener('click',closeSidebar);
function closeSidebar(){sidebarEl.classList.remove('open');backdropEl.classList.remove('open')}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target===document.getElementById('modalBg'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

document.addEventListener('error',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('crest-img')&&t.dataset.t){const sp=document.createElement('span');sp.className=t.className.replace('crest-img','').trim();sp.style.background=t.dataset.bg;sp.textContent=t.dataset.t;t.replaceWith(sp)}},true);
(async function start(){
  applyTheme();
  renderSidebar();
  updateTopbar();
  const el=document.getElementById('mainContent');
  if(el)el.innerHTML='<div class="empty">Загрузка…</div>';
  try{await Promise.race([initIDB(),new Promise(r=>setTimeout(()=>r(null),1500))])}catch(e){}
  try{load()}catch(e){}
  try{restoreUidCounter()}catch(e){}
  try{fixClubRatings();invalidateIdx()}catch(e){}
  try{game.players.forEach(p=>{if(p.contractEnd==null&&!p.freeAgent&&!p.retired)p.contractEnd=game.year+rnd(0,4)})}catch(e){}
  try{if(game.countries.length&&game.players.length&&(!game.nationalTeams||!game.nationalTeams.length)){initNationalTeams();save()}}catch(e){}
  renderCurrent();
  setInterval(()=>{try{save()}catch(e){}},60000);
  window.addEventListener('beforeunload',()=>{if(resetting)return;try{const json=JSON.stringify(game);try{localStorage.setItem(STORAGE_KEY,json)}catch(e){}if(idb)idbSave(json)}catch(e){}});
})();

})();
</script>
